<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>❤️ For You ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    overflow:hidden;
    background:linear-gradient(135deg,#ff9ecb,#ffd6e7);
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    text-align:center;
    z-index:10;
}

h1{
    color:white;
    margin-bottom:25px;
    text-shadow:2px 2px 8px #ff4d88;
}

button{
    font-size:22px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    margin:12px;
}

#yes{
    background:#22c55e;
    color:#fff;
}

#no{
    background:#ef4444;
    color:white;
    position:fixed;
    left:60%;
    top:65%;
}

.heart{
    position:fixed;
    top:-30px;
    color:#ff3366;
    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
    }
}
</style>
</head>

<body>

<div class="card">
<h1>💖 តើអ្នកព្រមធ្វើជាគូស្នេហ៍របស់ខ្ញុំទេ? 💖</h1>

<button id="yes">YES ❤️</button>
<button id="no">NO 💔</button>
</div>

<script>

for(let i=0;i<40;i++){
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(15+Math.random()*25)+"px";
    h.style.animationDuration=(3+Math.random()*5)+"s";
    document.body.appendChild(h);
}

const no=document.getElementById("no");

function move(){
    no.style.left=Math.random()*(window.innerWidth-120)+"px";
    no.style.top=Math.random()*(window.innerHeight-70)+"px";
}

no.addEventListener("touchstart",(e)=>{
    e.preventDefault();
    move();
});

no.addEventListener("mouseenter",move);

document.addEventListener("touchmove",(e)=>{
    let x=e.touches[0].clientX;
    let y=e.touches[0].clientY;

    let r=no.getBoundingClientRect();

    let dx=x-r.left;
    let dy=y-r.top;

    if(Math.abs(dx)<120 && Math.abs(dy)<120){
        move();
    }
});

document.getElementById("yes").onclick=function(){
document.body.innerHTML=`
<div style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
background:#ffdae8;
text-align:center;
padding:20px;">
<h1 style="font-size:70px;">🥰❤️</h1>
<h2>យេយយយ! អរគុណដែលព្រម ❤️</h2>
<h3>ចាប់ពីថ្ងៃនេះ អ្នកជាមនុស្សពិសេសរបស់ខ្ញុំ 🌹</h3>
</div>`;
}

</script>

</body>
</html>
